ch:[
["The Girl from Ur",0,`Around 2100 BCE, in the ancient Sumerian city of Ur, where mudbrick houses stood beneath the Mesopotamian sun and the great ziggurat rose above the city, lived a curious young girl named Inanna, whom her family called Ina.
Unlike most children, Ina was fascinated by how things worked. She collected unusual objects, studied the stars, and spent hours experimenting with wood, clay, reeds, and metal.
Her little sandy-colored puppy, Saga, followed her everywhere, while her younger brother, Amar, watched her experiments with endless curiosity.
But Ina had a secret.
Hidden away from her family and neighbors was a small workshop filled with unfinished inventions, mechanical models, and clay tablets covered in sketches.
She believed that every object held a secret waiting to be understood.
Her greatest creation was a mysterious mechanism inspired by the sacred architecture and symbols of ancient Mesopotamia. At its center stood a bull-shaped structure decorated with geometric patterns and blue stones resembling lapis lazuli.
Ina had discovered an unusual connection between the mechanism and a forgotten chamber beneath the great ziggurat.
She believed it could do something no machine had ever done before.
One evening, while experimenting with its moving components, the blue stones began to glow.
A deep vibration filled the chamber. The mechanism rotated, the ground trembled, and a brilliant opening appeared before her.
Beyond it was a landscape unlike anything she had ever imagined.
A world of red dust, distant mountains, and a dark sky.
Driven by curiosity, Ina stepped forward.
And Saga followed.`],
["A World Beyond Her Own",0,`When Ina emerged, the ground beneath her feet was covered in fine red dust.
The air was silent. Strange rocks stretched across the horizon, and the distant landscape looked almost lifeless.
She was no longer in ancient Ur.
She was on Mars.
In the distance, something caught her attention.
A small robotic explorer rested on the Martian surface. Its six wheels were motionless, its metal body was covered in dust, and its solar panels stood beneath the pale sunlight.
Ina approached cautiously.
On its body, she discovered a name: OPPORTUNITY.
She had never seen anything like it.
Near the rover, she found a damaged-looking piece of equipment and a small display that had preserved information about the machine and its mission.
The records revealed something extraordinary.
The year was 2026.
More than two decades had passed since the machine first arrived on Mars.
Opportunity was not a creature, nor was it an ordinary machine. It was a robotic explorer built by NASA to investigate the Red Planet.
Ina began studying the information.
What she discovered was the story of an explorer that had travelled farther and survived much longer than anyone had expected.`],
["The Machine Built to Explore",1,`Opportunity was launched from Cape Canaveral, Florida, on July 7, 2003, aboard a Delta II rocket.
It was part of NASA's Mars Exploration Rover mission, alongside its twin rover, Spirit.
After travelling through space for nearly seven months, Opportunity reached Mars and landed in the Meridiani Planum region on January 24, 2004.
Its landing was an extraordinary engineering achievement.
Protected by a heat shield during atmospheric entry, the spacecraft used a parachute and a system of airbags to cushion its landing. It bounced across the Martian surface before finally coming to rest inside Eagle Crater.
The rover was designed to operate for only 90 Martian days, known as sols, and travel approximately one kilometer.
Yet its journey would become one of the most remarkable achievements in robotic exploration.
Opportunity was equipped with six wheels, solar panels, cameras, and a robotic arm carrying scientific instruments.
Its design allowed it to travel across rocky terrain, examine geological formations, and investigate materials that could reveal the planet's ancient history.
To Ina, the machine was a laboratory on wheels.
But she had not yet discovered what made it so important.`],
["A Laboratory on Wheels",1,`As Ina explored the rover's preserved scientific records, she discovered that Opportunity had carried an entire collection of specialized instruments.
Each one had a different purpose.
Its Panoramic Camera, known as Pancam, captured detailed images of the Martian landscape and helped scientists examine distant geological features.
Navigation Cameras helped the rover understand its surroundings and plan its movements, while Hazard Avoidance Cameras monitored nearby obstacles.
The Microscopic Imager revealed details too small to be seen in ordinary photographs.
The Miniature Thermal Emission Spectrometer, known as Mini-TES, studied infrared radiation to help identify minerals from a distance.
Other instruments examined materials more closely.
The Mössbauer Spectrometer investigated iron-bearing minerals, while the Alpha Particle X-ray Spectrometer, or APXS, measured the chemical elements present in rocks and soil.
At the end of its robotic arm, Opportunity carried the Rock Abrasion Tool, known as RAT. It could grind away the weathered surface of rocks, exposing fresher material for scientific examination.
Magnetic arrays collected magnetic dust particles, allowing scientists to investigate their composition.
Together, these instruments transformed Opportunity into a mobile geological laboratory.
Every photograph, measurement, and experiment helped scientists understand the history of Mars.
Ina realized that the rover's greatest strength was not its ability to move.
It was its ability to observe, investigate, and discover.`],
["The Blueberries of Mars",1,`One of Opportunity's earliest discoveries had been made near its landing site.
Scattered across the Martian ground were thousands of tiny, rounded formations that scientists nicknamed the Martian blueberries.
They were not plants or fruit.
They were mineral concretions rich in hematite, an iron oxide associated with water-related geological processes.
Using its scientific instruments, Opportunity examined these unusual formations and the rocks surrounding them.
The observations helped scientists understand that liquid water had once altered the rocks in this region.
The discovery was especially important because the mission was designed to investigate whether ancient Martian environments could have supported microbial life.
The rover was not searching for living organisms directly.
Instead, it was searching for geological evidence of environments that might once have been suitable for life.
Ina studied the images of the tiny spheres.
Something so small had revealed something so enormous.
Mars had not always been the dry, dusty world she was standing on.
Its ancient history contained traces of water.
And Opportunity had helped uncover them.`],
["The Secrets Buried in Stone",1,`As the years passed, Opportunity travelled across the Martian landscape, examining craters, rock layers, and geological formations.
Eventually, it reached the region around Endeavour Crater, where new discoveries awaited.
In 2011, near a location called Cape York, Opportunity examined a bright mineral vein known as Homestake.
Measurements showed that it was rich in calcium and sulfur, with evidence suggesting it could be the mineral gypsum.
Such mineral veins provided evidence that water had once moved through fractures in the Martian bedrock, leaving minerals behind as it changed the surrounding environment.
The discovery added another piece to the geological history of Mars.
Different locations preserved different records of ancient water.
Some environments had been acidic and challenging for life as we know it, while other evidence suggested that certain ancient settings may have been less acidic.
Opportunity helped scientists investigate these differences and understand how Martian environments changed over time.
It had not discovered life.
But it had helped answer a fundamental question:
Could Mars once have possessed environments suitable for life?
The rocks were slowly revealing their secrets.
And Opportunity was learning to read them.`],
["An Unexpected Discovery",1,`Opportunity's scientific journey was not limited to studying the planet beneath its wheels.
In January 2005, it encountered something unexpected near the remains of its discarded heat shield.
A strange, pitted object stood out against the surrounding landscape.
Using its instruments, Opportunity examined the object and discovered that it was an iron-nickel meteorite.
It became the first meteorite of any type identified on another planet.
Scientists named it Heat Shield Rock.
The discovery demonstrated that Mars was not simply a world shaped by its own geological processes.
Objects from space had also contributed to its history.
Opportunity continued its exploration, travelling through impact craters, examining unusual rocks, and crossing challenging terrain.
It even climbed slopes reaching approximately 32 degrees, demonstrating capabilities beyond its original engineering expectations.
By the end of its mission, the rover had travelled approximately 45.16 kilometers.
A machine originally designed to travel just one kilometer had completed a journey more than forty-five times longer than planned.
Its mission had become a remarkable example of engineering endurance.`],
["When the Sky Went Dark",1,`By June 2018, Opportunity had spent more than fourteen years exploring Mars.
Then, a massive dust storm began spreading across the planet.
The storm grew so large that dust filled the atmosphere and blocked much of the sunlight reaching the surface.
For Opportunity, this was a serious threat.
Unlike some other spacecraft, Opportunity depended on solar panels to generate the electricity needed to operate its systems and communicate with Earth.
As the storm darkened the sky, the rover received less and less sunlight.
Its available power decreased dramatically.
On June 10, 2018, NASA received the final communication from Opportunity.
Among the last data transmitted was a dark, incomplete image captured by its Panoramic Camera.
The image was not a written farewell.
It was a scientific photograph, partially transmitted as the dust storm blocked the sunlight.
Then the signals stopped.
On Earth, the engineers and scientists who had guided Opportunity for years waited for another transmission.
But the rover remained silent.`],
["A Thousand Attempts",1,`The loss of communication did not immediately mean the mission was over.
Engineers at NASA's Jet Propulsion Laboratory began an extensive recovery effort.
They sent more than a thousand commands in attempts to reestablish contact with Opportunity.
They continued listening for a response as the months passed.
But no signal returned.
The storm eventually weakened, yet the rover did not resume communication.
On February 13, 2019, NASA officially declared the Opportunity mission complete.
After nearly fifteen years of exploration, its journey had reached its end.
Its original 90-sol mission had become one of the longest and most successful robotic explorations of Mars.
The machine that had once travelled across an unfamiliar world was now silent.
But the discoveries it had made remained.`],
["A Second Chance",0,`Ina stood beside Opportunity, looking at the machine that had travelled farther than she could have imagined.
She now understood its purpose, its achievements, and the extraordinary effort behind its journey.
She thought about the people on Earth who had built it, guided it, and waited for its messages.
Although the rover could no longer communicate, its scientific records had survived.
Ina realized that its story deserved to continue.
She began examining its design, studying its wheels, cameras, robotic arm, and solar panels.
The technology was far beyond anything she had ever constructed in ancient Ur.
Her first attempts to understand it failed.
But failure had never stopped her before.
She returned to her mysterious bull-shaped mechanism and began imagining a way to connect its unusual energy source to the rover.
In her fictional world, she developed a new system inspired by the mechanical designs of ancient Mesopotamia.
Her imagination went further.
What if the rover could move beyond the limitations of its original design?
What if it could leap across obstacles or briefly rise above the ground?
She imagined lightweight mechanical structures and wing-like additions decorated with patterns inspired by the ancient art of Ur.
These ideas were not part of Opportunity's real engineering history.
They belonged to Ina's imagination and the fictional world of this story.
But they represented something important.
An old explorer did not have to be forgotten simply because its original mission had ended.
For Ina, Opportunity deserved another journey.`],
["The Journey Continues",0,`In the imagined world of UR GENESIS, Ina and Opportunity prepare to explore Mars together.
Their journey is no longer about proving that the rover can survive.
It is about discovering what remains hidden across the Red Planet.
With Ina's fictional inventions, the old explorer gains new possibilities.
Together, they travel across unfamiliar landscapes, encounter unexpected geological formations, and investigate places that reveal more about the planet's history.
Every adventure introduces a real part of Opportunity's scientific legacy:
The cameras reveal the landscape.
The microscopic imager uncovers details hidden within rocks.
The spectrometers investigate mineral compositions.
The robotic arm examines the evidence left behind by ancient water.
And the discoveries made by the real rover become the foundation for their fictional adventures.
Through every challenge, Ina learns that exploration is not simply about reaching new places.
It is about asking questions, understanding evidence, and continuing to search even when the answers are difficult to find.`],
["Abandoned, Not Forgotten",0,`Far away from Mars, beneath the ancient sky of Ur, a little boy named Amar waits for his sister.
He is still too young to understand the distance between worlds or the mysteries of time.
But he knows that Ina always returns with extraordinary stories.
One day, she will tell him about a silent machine that once explored another planet.
She will tell him about the tiny mineral spheres that revealed the presence of ancient water, the meteorite that came from beyond Mars, and the dust storm that ended an extraordinary mission.
She will tell him about a machine designed to work for just 90 Martian days, yet continued exploring for nearly fifteen years.
And she will tell him that even though Opportunity can no longer answer the calls of Earth, its discoveries continue to help humanity understand another world.
For Ina, the greatest discovery was not simply what Opportunity had found on Mars.
It was what the rover represented.
Curiosity.
Perseverance.
The courage to explore the unknown.
And the belief that knowledge can outlive the machines that discover it.
For UR GENESIS, Opportunity represents the heart of Abandoned: Not Forgotten.
An explorer that can no longer answer our calls, but whose work continues to speak.
The mission ended. The discoveries remain.
Opportunity is not forgotten.`]],

ch:[
["الفتاة من أور",0,`حوالي عام 2100 قبل الميلاد، في مدينة أور السومرية القديمة، حيث كانت بيوت الطوب اللبن تقف تحت شمس بلاد الرافدين وترتفع الزقورة العظيمة فوق المدينة، عاشت فتاة صغيرة فضولية اسمها إنانا، وكان أهلها ينادونها إينا.
وعلى خلاف معظم الأطفال، كانت إينا مفتونة بكيفية عمل الأشياء. كانت تجمع الأغراض الغريبة، وتدرس النجوم، وتقضي ساعات في التجريب بالخشب والطين والقصب والمعدن.
وكان جروها الصغير ذو اللون الرملي، ساغا، يتبعها أينما ذهبت، بينما يراقب أخوها الأصغر، عمار، تجاربها بفضول لا ينتهي.
لكن لإينا سراً.
ففي مكان بعيد عن أعين أهلها وجيرانها كانت لديها ورشة صغيرة مليئة بالاختراعات غير المكتملة والنماذج الميكانيكية والألواح الطينية المغطاة بالرسومات.
كانت تؤمن بأن لكل شيء سراً ينتظر من يفهمه.
وكان أعظم ما صنعته آلة غامضة مستوحاة من العمارة المقدسة ورموز بلاد الرافدين القديمة. وفي مركزها بنية على شكل ثور، مزينة بنقوش هندسية وأحجار زرقاء تشبه حجر اللازورد.
وقد اكتشفت إينا صلة غريبة بين الآلة وغرفة منسية تحت الزقورة العظيمة.
وكانت تؤمن بأن الآلة قادرة على فعل ما لم تفعله أي آلة من قبل.
وفي إحدى الأمسيات، وبينما كانت تجرب أجزاءها المتحركة، بدأت الأحجار الزرقاء تتوهج.
ملأ الغرفة اهتزاز عميق. دارت الآلة، وارتجت الأرض، وانفتحت أمامها فتحة ساطعة.
ومن خلفها ظهر منظر لم تتخيله قط.
عالم من الغبار الأحمر والجبال البعيدة والسماء المظلمة.
وبدافع الفضول، خطت إينا إلى الأمام.
وتبعها ساغا.`],
["عالم غير عالمها",0,`حين خرجت إينا، كانت الأرض تحت قدميها مغطاة بغبار أحمر ناعم.
كان الهواء صامتاً. وامتدت صخور غريبة عبر الأفق، وبدا المشهد البعيد شبه خالٍ من الحياة.
لم تعد في أور القديمة.
لقد كانت على المريخ.
وفي البعيد، لفت انتباهها شيء ما.
مستكشف آلي صغير كان ساكناً على سطح المريخ. عجلاته الست متوقفة، وجسمه المعدني مغطى بالغبار، وألواحه الشمسية قائمة تحت ضوء الشمس الباهت.
اقتربت إينا بحذر.
وعلى جسمه اكتشفت اسماً: OPPORTUNITY.
لم ترَ شيئاً مثله من قبل.
وقرب المركبة وجدت قطعة معدات تبدو متضررة وشاشة صغيرة حفظت معلومات عن الآلة ومهمتها.
وكشفت السجلات عن أمر استثنائي.
كانت السنة 2026.
لقد مضى أكثر من عقدين منذ وصلت هذه الآلة إلى المريخ لأول مرة.
لم تكن أوبورتيونيتي كائناً حياً، ولا آلة عادية. كانت مستكشفاً آلياً بنته ناسا لدراسة الكوكب الأحمر.
بدأت إينا تدرس المعلومات.
وما اكتشفته كان قصة مستكشف سافر أبعد مما توقع أي أحد، وعاش أطول بكثير مما توقعوا.`],
["الآلة التي بُنيت للاستكشاف",1,`أُطلقت أوبورتيونيتي من كيب كانافيرال في ولاية فلوريدا في 7 يوليو 2003 على متن صاروخ دلتا II.
وكانت جزءاً من مهمة ناسا لمركبتي استكشاف المريخ، إلى جانب توأمها، المركبة سبيريت.
وبعد رحلة في الفضاء استمرت نحو سبعة أشهر، وصلت أوبورتيونيتي إلى المريخ وهبطت في منطقة ميريديياني بلانوم في 24 يناير 2004.
وكان هبوطها إنجازاً هندسياً استثنائياً.
فقد حماها درع حراري أثناء دخول الغلاف الجوي، واستخدمت المركبة مظلة ونظاماً من الوسائد الهوائية لتخفيف الصدمة. وارتدت عبر سطح المريخ قبل أن تستقر أخيراً داخل فوهة إيغل.
وصُممت المركبة لتعمل 90 يوماً مريخياً فقط، تُعرف بالسولات، وتقطع نحو كيلومتر واحد.
ومع ذلك، ستصبح رحلتها من أبرز إنجازات الاستكشاف الآلي.
جُهزت أوبورتيونيتي بست عجلات وألواح شمسية وكاميرات وذراع آلية تحمل أدوات علمية.
وسمح لها تصميمها بالتنقل عبر التضاريس الصخرية، وفحص التكوينات الجيولوجية، ودراسة مواد قد تكشف تاريخ الكوكب القديم.
وبالنسبة لإينا، كانت الآلة مختبراً على عجلات.
لكنها لم تكتشف بعد ما الذي جعلها بهذه الأهمية.`],
["مختبر على عجلات",1,`وبينما كانت إينا تستكشف السجلات العلمية المحفوظة للمركبة، اكتشفت أن أوبورتيونيتي حملت مجموعة كاملة من الأدوات المتخصصة.
ولكل أداة غرض مختلف.
فقد التقطت كاميرتها البانورامية، المعروفة بـ Pancam، صوراً مفصلة للمشهد المريخي وساعدت العلماء على فحص المعالم الجيولوجية البعيدة.
وساعدت كاميرات الملاحة المركبة على فهم محيطها وتخطيط حركتها، بينما راقبت كاميرات تجنب العوائق ما حولها من عقبات.
وكشف المصوّر المجهري تفاصيل أصغر من أن تُرى في الصور العادية.
ودرس مطياف الانبعاث الحراري المصغر، المعروف بـ Mini-TES، الأشعة تحت الحمراء للمساعدة في تحديد المعادن من مسافة بعيدة.
وفحصت أدوات أخرى المواد عن قرب.
فقد بحث مطياف موسباور في المعادن الحاملة للحديد، بينما قاس مطياف جسيمات ألفا والأشعة السينية، أو APXS، العناصر الكيميائية الموجودة في الصخور والتربة.
وفي نهاية ذراعها الآلية حملت أوبورتيونيتي أداة كشط الصخور، المعروفة بـ RAT. وكانت قادرة على كشط السطح المتجوّي للصخور لتكشف مادة أحدث للفحص العلمي.
وجمعت مصفوفات مغناطيسية جسيمات الغبار المغناطيسي، ما أتاح للعلماء دراسة تركيبها.
ومعاً، حولت هذه الأدوات أوبورتيونيتي إلى مختبر جيولوجي متنقل.

{n:"Spirit",e:ICO.rover,u:"https://science.nasa.gov/mission/mer-spirit/",en:["Mars rover · 2004–2011","Opportunity's twin. It drove 7.73 km before getting stuck in soft soil. NASA lost contact in March 2010 and ended recovery efforts on May 25, 2011."],ar:["مركبة المريخ · 2004–2011","توأم أوبورتيونيتي. قطعت 7.73 كم قبل أن تعلق في تربة رخوة. انقطع الاتصال بها في مارس 2010، وأنهت ناسا محاولات استعادتها في 25 مايو 2011."]},

arm:[["RAT","Grinds away dusty, weathered rock surfaces to expose fresh material.","The outside of a rock is altered by its environment; the fresh rock underneath tells a truer story. Grinding hard volcanic rock took about two hours."],["Microscopic Imager","Takes close-up, high-resolution images of rocks and soil.","It reveals tiny textures and grains that hint at how a rock formed."],["APXS","Measures which chemical elements are in rocks and soil.","It uses alpha particles and X-rays; each element responds in its own way. Most measurements were made at night and needed at least 10 hours."],["Mössbauer","Identifies iron-bearing minerals and how much of them there is.","Iron-bearing minerals can show how rocks interacted with water. One measurement took about 12 hours."]],
body:[["Warm electronics box","An insulated compartment that protects temperature-sensitive parts.","Mars is very cold, so the electronics, the batteries and Mini-TES stay inside the warm body."],["Magnetic arrays","Collect airborne magnetic dust particles.","Studying the magnetic dust with APXS and the Mössbauer Spectrometer helps scientists learn what the dust is made of."]],
wheel:[["Rocker-bogie","A pivoting suspension that keeps the wheels on the ground.","It lets the rover roll over obstacles about as big as its wheels (≈26 cm) without tipping."],["Six wheels","Carried the rover across rocky ground and slopes of about 32°.","On loose sand and rock, traction matters more than speed, so the rover moved slowly and carefully."]]}},
